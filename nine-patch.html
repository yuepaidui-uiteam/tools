<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create Android .9.png assets locally in your browser.">
  <title>.9 图制作工具</title>
  <link rel="stylesheet" href="assets/tools/tools.css">
  <style>
    .tool-main { padding:42px 0 80px; }.tool-heading { margin-bottom:26px; max-width:760px; }.tool-heading h1 { font-size:38px; letter-spacing:0; margin:8px 0; }.tool-heading p { color:var(--muted); margin:0; }
    .workspace { align-items:stretch; display:grid; gap:18px; grid-template-columns:minmax(0,1fr) 340px; }.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:20px; }.editor-panel, .preview-panel { display:flex; flex-direction:column; }.panel h2 { font-size:18px; margin:0 0 16px; }.control { display:grid; gap:7px; margin-bottom:15px; }.control label { font-size:13px; font-weight:750; }.control input, .control select { background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--text); font:inherit; padding:9px; width:100%; }.editor-settings { display:grid; gap:10px; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); margin-bottom:12px; }.editor-settings .control { margin-bottom:0; }.hint, .status { color:var(--muted); font-size:13px; margin:0; }.status { margin-top:14px; min-height:40px; }.status [data-severity="error"] { color:#bd3042; }.status [data-severity="warning"] { color:#a86800; }
    .button { border:0; cursor:pointer; margin:0; }.button.secondary { background:var(--surface); color:var(--text); }.button:disabled { cursor:not-allowed; opacity:.5; }.file-input { display:none; }.choose-button { align-items:center; display:flex; justify-content:center; width:100%; }
    .mode-group { display:grid; gap:8px; grid-template-columns:1fr 1fr; margin-bottom:12px; }.mode-group button { background:var(--surface); border:1px solid var(--line); border-radius:6px; color:var(--text); cursor:pointer; font:inherit; font-weight:700; padding:9px 7px; }.mode-group button[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
    .canvas-toolbar { align-items:center; display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; margin-bottom:12px; }.toolbar-control { align-items:center; display:flex; gap:8px; }.toolbar-control label { color:var(--muted); font-size:13px; font-weight:750; }.toolbar-control select { background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--text); font:inherit; padding:7px 9px; }
    .density-group { border:1px solid var(--line); border-radius:8px; display:grid; gap:8px; grid-template-columns:repeat(2,minmax(0,1fr)); margin-bottom:14px; padding:10px; }.density-group label { align-items:center; color:var(--text); display:flex; font-size:13px; gap:7px; }.density-group input { accent-color:var(--brand); height:15px; width:15px; }
    .canvas-frame { background:var(--surface); background:color-mix(in srgb,var(--surface) 78%,var(--panel)); border:0; border-radius:8px; display:grid; min-height:360px; overflow:hidden; padding:28px; place-items:center; position:relative; }.canvas-frame canvas { display:block; image-rendering:pixelated; max-width:none; touch-action:none; }.canvas-frame canvas[hidden] { display:none; }.editor-canvas-stack { position:relative; }.editor-canvas-stack[hidden] { display:none; }.editor-canvas-stack canvas { height:100%; left:0; position:absolute; top:0; width:100%; }.editor-canvas-stack .edit-canvas { position:relative; }.guide-canvas { image-rendering:auto!important; pointer-events:none; }.empty-canvas { align-items:center; background:color-mix(in srgb,var(--brand) 9%,var(--surface)); border:2px dashed color-mix(in srgb,var(--brand) 82%,var(--line)); border-radius:8px; box-sizing:border-box; color:var(--muted); display:flex; flex-direction:column; gap:10px; justify-content:center; min-height:190px; padding:22px; text-align:center; width:min(100%,360px); }.empty-canvas[hidden] { display:none; }.empty-canvas strong { color:var(--text); font-size:17px; }.empty-canvas span { font-size:13px; }.empty-canvas .button { box-shadow:0 10px 24px rgba(92,72,255,.22); max-width:150px; padding:10px 16px; }.canvas-actions { align-items:center; display:flex; gap:12px; justify-content:space-between; margin-top:14px; }.canvas-actions .button { background:var(--surface); border:1px solid var(--line); color:var(--text); min-width:190px; padding:12px 14px; }.canvas-actions .button:not(:disabled):hover { border-color:var(--brand); }.canvas-actions .button:disabled { background:var(--surface); color:var(--muted); opacity:1; }.canvas-actions .toolbar-control { background:transparent; border:0; border-radius:0; padding:0; }.canvas-actions .toolbar-control select { background:var(--bg); }.preview-panel { padding:18px; }.preview-panel h2 { margin-bottom:12px; }.preview-size-row { display:grid; gap:8px; grid-template-columns:1fr 1fr; }.preview-size-row .control { margin-bottom:12px; }.preview-frame { background:var(--surface); flex:1 1 auto; min-height:170px; overflow:hidden; padding:10px; }.preview-frame canvas { box-shadow:0 2px 12px rgba(0,0,0,.16); cursor:nwse-resize; image-rendering:pixelated; max-height:100%; max-width:100%; }
    @media (max-width:1000px) { .workspace { grid-template-columns:minmax(0,1fr); }.preview-panel { grid-column:auto; }.preview-frame { min-height:190px; } }
    @media (max-width:680px) { .tool-main { padding-top:30px; }.tool-heading h1 { font-size:32px; }.workspace, .panel { max-width:calc(100vw - 36px); min-width:0; width:100%; }.workspace { grid-template-columns:minmax(0,1fr); overflow:hidden; }.preview-panel { grid-column:auto; }.canvas-frame { min-height:320px; max-width:100%; }.control input, .control select, .mode-group button, .button { max-width:100%; min-width:0; }.mode-group { grid-template-columns:minmax(0,1fr); }.canvas-toolbar { align-items:flex-start; flex-direction:column; }.toolbar-control, .toolbar-control select { max-width:100%; } .panel { padding:16px; } }
  </style>
</head>
<body>
  <main class="tool-main"><div class="wrap"><header class="tool-heading"><div class="eyebrow" data-i18n="tools_eyebrow">免费图片工具</div><h1 data-i18n="nine_title">.9 图制作工具</h1><p data-i18n="nine_lead">选择或拖入 PNG，自动创建拉伸区；拖动虚线就能调整切片，图片只在本地浏览器处理。</p></header>
    <div class="workspace">
      <section class="panel editor-panel" aria-labelledby="editor-title">
        <input id="nineFileInput" class="file-input" type="file" accept="image/png">
        <div class="canvas-toolbar"><h2 id="editor-title" data-i18n="slice_region">切片区域</h2></div>
        <div class="editor-settings"><div class="control"><label for="drawableName" data-i18n="resource_name">资源名称</label><input id="drawableName" value="drawable" autocomplete="off" spellcheck="false"></div><div class="control"><label for="sourceDensity" data-i18n="source_density">源图密度</label><select id="sourceDensity"><option value="mdpi">mdpi</option><option value="hdpi">hdpi</option><option value="xhdpi" selected>xhdpi</option><option value="xxhdpi">xxhdpi</option><option value="xxxhdpi">xxxhdpi</option></select></div></div>
        <div class="mode-group" role="group" aria-label="标记模式" data-i18n-aria-label="marker_mode"><button id="modeStretch" type="button" aria-pressed="true" data-i18n="stretch_region">拉伸区</button><button id="modePadding" type="button" aria-pressed="false" data-i18n="content_padding">内容 padding</button></div>
        <div id="editCanvasFrame" class="canvas-frame"><label id="emptyEditor" class="empty-canvas" for="nineFileInput"><strong data-i18n="drop_png">拖入图片到这里</strong><span data-i18n="local_choose_png">或从本机选择 PNG / .9.png</span><span id="nineChooseButton" class="button" data-i18n="choose_image">选择图片</span></label><div id="editorCanvasStack" class="editor-canvas-stack" hidden><canvas id="editCanvas" class="edit-canvas" aria-label=".9 图切片编辑器" data-i18n-aria-label="editor_label"></canvas><canvas id="guideCanvas" class="guide-canvas" aria-hidden="true"></canvas></div></div>
        <div class="canvas-actions"><button id="autoStretch" class="button secondary" type="button" disabled data-i18n="auto_stretch">重新自动创建拉伸区</button><div class="toolbar-control"><label for="editorBackground" data-i18n="background">背景</label><select id="editorBackground"><option value="checker" data-i18n="checker">棋盘格</option><option value="light" data-i18n="light">浅色</option><option value="dark" data-i18n="dark">深色</option></select></div></div>
      </section>
      <aside class="panel preview-panel" aria-labelledby="preview-title"><h2 id="preview-title" data-i18n="preview">预览</h2>
        <div class="preview-size-row"><div class="control"><label for="previewWidth" data-i18n="width">宽度</label><input id="previewWidth" type="number" min="1" value="240"></div><div class="control"><label for="previewHeight" data-i18n="height">高度</label><input id="previewHeight" type="number" min="1" value="140"></div></div>
        <div id="previewFrame" class="canvas-frame preview-frame"><canvas id="previewCanvas" width="240" height="140" aria-label="拖动预览图调整宽高" data-i18n-aria-label="preview_label"></canvas></div>
        <div id="nineStatus" class="status" aria-live="polite" data-i18n="nine_initial_status">请先加载图片，再制作 .9 图。</div>
        <div class="control" style="margin-top:12px"><label data-i18n="export_density">导出倍数</label><div id="exportDensityGroup" class="density-group" role="group" aria-label="导出倍数" data-i18n-aria-label="export_density"><label><input type="checkbox" name="exportDensity" value="mdpi">mdpi</label><label><input type="checkbox" name="exportDensity" value="hdpi">hdpi</label><label><input type="checkbox" name="exportDensity" value="xhdpi" checked>xhdpi</label><label><input type="checkbox" name="exportDensity" value="xxhdpi">xxhdpi</label><label><input type="checkbox" name="exportDensity" value="xxxhdpi">xxxhdpi</label></div></div>
        <button id="downloadNine" class="button" type="button" disabled style="margin-top:12px;width:100%" data-i18n="download_nine">下载 .9.png</button>
      </aside>
    </div>
  </div></main>
  <script src="assets/tools/vendor/jszip.min.js"></script>
  <script type="module" src="assets/tools/nine-patch.mjs"></script>
</body>
</html>
