    :root { color-scheme: dark; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f7f5ff; background: radial-gradient(circle at top left, #34246d, #10101d 45%, #08080f); }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 56px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: .03em; }
    .lead { margin: 10px 0 30px; color: #b9b7cf; }
    .layout { display: grid; grid-template-columns: minmax(270px, 360px) 1fr; gap: 22px; align-items: stretch; }
    .panel { padding: 20px; border: 1px solid rgba(255,255,255,.13); border-radius: 18px; background: rgba(26, 24, 45, .86); box-shadow: 0 18px 55px rgba(0,0,0,.2); }
    .panel h2 { margin: 0 0 18px; font-size: 17px; }
    .field { margin: 0 0 16px; }
    .field label, .field-label { display: block; margin-bottom: 8px; color: #dedcf1; font-size: 13px; }
    .required { color: #ff91ba; }
    input[type="file"] { width: 100%; color: #bcb9cb; font-size: 12px; }
    input[type="file"]::file-selector-button, button { border: 0; border-radius: 9px; padding: 8px 10px; color: #fff; background: #5743a9; cursor: pointer; font: inherit; }
    input[type="file"]::file-selector-button { margin-right: 9px; }
    button { background: rgba(255,255,255,.11); font-size: 12px; }
    button:hover, input[type="file"]::file-selector-button:hover { background: #7059d5; }
    .file-row { display: flex; gap: 8px; align-items: center; }
    .file-row input { min-width: 0; flex: 1; }
    .control-grid { display: grid; grid-template-columns: 1fr 74px; gap: 10px; }
    input[type="text"], input[type="number"] { width: 100%; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; padding: 9px 10px; color: #fff; background: #12111f; font: inherit; }
    input[type="color"] { width: 100%; height: 39px; border: 0; border-radius: 9px; padding: 3px; background: #12111f; cursor: pointer; }
    .toggle { display: flex; align-items: center; gap: 8px; margin: 4px 0 0; color: #dedcf1; font-size: 13px; cursor: pointer; }
    .hint { margin: -4px 0 0; color: #8d8aa4; font-size: 12px; line-height: 1.5; }
    .preview-panel { min-height: 390px; display: grid; place-items: center; align-content: center; gap: 22px; overflow: hidden; }
    .preview-shell { position: relative; width: min(100%, 680px); min-height: 176px; display: grid; place-items: center; border-radius: 14px; padding: 40px 18px; background-color: #eceaf3; background-image: linear-gradient(45deg, #d4d1dd 25%, transparent 25%), linear-gradient(-45deg, #d4d1dd 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d4d1dd 75%), linear-gradient(-45deg, transparent 75%, #d4d1dd 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0; }
    .preview-shell.solid { background: #2a283a; }
    .preview-list { width: 100%; display: grid; gap: 18px; }
    .preview-stage { display: grid; gap: 8px; }
    .preview-label { margin: 0; color: #dedcf1; font-size: 13px; font-weight: 700; text-align: center; }
    #previewCanvas, #previewCanvas110 { display: none; max-width: 100%; height: auto; image-rendering: auto; filter: drop-shadow(0 8px 11px rgba(31, 0, 48, .18)); }
    .svga-layer, .text-layer { position: absolute; pointer-events: none; }
    .svga-layer { inset: 0; }
    .svga-layer { z-index: 2; }
    .text-layer { z-index: 3; display: none; }
    .empty-preview { color: #69657c; font-size: 14px; text-align: center; }
    @media (max-width: 760px) { main { padding-top: 24px; } .layout { grid-template-columns: 1fr; } .preview-panel { min-height: 300px; } }
  </style>

<body>
  <main>
    <h1>靓号秀 Party 切片预览器</h1>
    <p class="lead">中心线为拉伸区域，注意不要放装饰资源，会拉伸变形！！！</p>
    <div class="layout">
      <section class="panel" aria-label="资源与文字控制">
        <h2>上传切片</h2>
        <div class="field">
          <label for="backgroundInput">背景 PNG <span class="required">必填</span></label>
          <div class="file-row"><input id="backgroundInput" type="file" accept="image/png"><button type="button" data-clear="background">清除</button></div>
        </div>
        <div class="field">
          <label for="leftDecorationInput">左装饰 PNG / SVGA <span class="hint">可选</span></label>
          <div class="file-row"><input id="leftDecorationInput" type="file" accept="image/png,.png,.svga"><button type="button" data-clear="left">清除</button></div>
        </div>
        <div class="field">
          <label for="rightDecorationInput">右装饰 PNG / SVGA <span class="hint">可选</span></label>
          <div class="file-row"><input id="rightDecorationInput" type="file" accept="image/png,.png,.svga"><button type="button" data-clear="right">清除</button></div>
        </div>
        <h2>文字与尺寸</h2>
        <div class="field"><label for="numberInput">靓号文字</label><input id="numberInput" type="text" value="666666" maxlength="20"></div>
        <div class="field control-grid"><div><label for="fontSizeInput">字号（px）</label><input id="fontSizeInput" type="number" min="12" max="72" value="36"></div><div><label for="colorInput">颜色</label><input id="colorInput" type="color" value="#ffffff"></div></div>
        <label class="toggle"><input id="checkerInput" type="checkbox" checked> 显示透明棋盘底纹</label>
      </section>
      <section class="panel preview-panel" aria-label="资源预览">
        <div class="preview-list">
          <div class="preview-stage">
            <p class="preview-label">资源高度：110px</p>
            <div id="previewShell110" class="preview-shell">
              <canvas id="previewCanvas110" aria-label="110px 高度靓号秀资源预览"></canvas>
              <div id="svgaLayer110" class="svga-layer"></div>
              <canvas id="textCanvas110" class="text-layer" aria-hidden="true"></canvas>
              <div id="emptyPreview110" class="empty-preview">请先上传必填的背景 PNG</div>
            </div>
          </div>
          <div class="preview-stage">
            <p class="preview-label">资源高度：80px</p>
            <div id="previewShell" class="preview-shell">
              <canvas id="previewCanvas" aria-label="80px 高度靓号秀资源预览"></canvas>
              <div id="svgaLayer" class="svga-layer"></div>
              <canvas id="textCanvas" class="text-layer" aria-hidden="true"></canvas>
              <div id="emptyPreview" class="empty-preview">请先上传必填的背景 PNG</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip-utils@0.1.0/dist/jszip-utils.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svgaplayerweb@2.3.2/build/svga.min.js"></script>
  <script>
    (() => {
      const DESIGN_HEIGHT = 80;
      const MIN_WIDTH = 140;
      const HORIZONTAL_PADDING = 42;
      const PREVIEW_HEIGHTS = [110, 80];
      const state = { background: null, left: null, right: null, urls: { background: null, left: null, right: null } };
      const inputs = {
        background: document.querySelector('#backgroundInput'),
        left: document.querySelector('#leftDecorationInput'),
        right: document.querySelector('#rightDecorationInput'),
        text: document.querySelector('#numberInput'),
        fontSize: document.querySelector('#fontSizeInput'),
        color: document.querySelector('#colorInput'),
        checker: document.querySelector('#checkerInput')
      };
      const previews = [
        { height: PREVIEW_HEIGHTS[0], canvas: document.querySelector('#previewCanvas110'), textCanvas: document.querySelector('#textCanvas110'), svgaLayer: document.querySelector('#svgaLayer110'), shell: document.querySelector('#previewShell110'), empty: document.querySelector('#emptyPreview110'), players: [] },
        { height: PREVIEW_HEIGHTS[1], canvas: document.querySelector('#previewCanvas'), textCanvas: document.querySelector('#textCanvas'), svgaLayer: document.querySelector('#svgaLayer'), shell: document.querySelector('#previewShell'), empty: document.querySelector('#emptyPreview'), players: [] }
      ];

      function sourceWidthAtHeight(image, height) { return image.naturalWidth * (height / image.naturalHeight); }

      function decorationWidth(asset, height) {
        if (!asset) return 0;
        return asset.type === 'png' ? sourceWidthAtHeight(asset.image, height) : 100 * height / DESIGN_HEIGHT;
      }

      function fontValue(height) {
        const scale = height / DESIGN_HEIGHT;
        return `700 ${Math.max(12, Number(inputs.fontSize.value) || 36) * scale}px "Kelson Sans", "Kelson Sans Bold", Arial, sans-serif`;
      }

      function calculatePreviewWidth(ctx, text, height) {
        const scale = height / DESIGN_HEIGHT;
        return Math.max(Math.ceil(MIN_WIDTH * scale), Math.ceil(ctx.measureText(text).width + HORIZONTAL_PADDING * scale * 2));
      }

      function getVerticallyCenteredBaseline(ctx, text, height) {
        const metrics = ctx.measureText(text);
        const scale = height / DESIGN_HEIGHT;
        const fontSize = Math.max(12, Number(inputs.fontSize.value) || 36) * scale;
        const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.75;
        const descent = metrics.actualBoundingBoxDescent || fontSize * 0.25;
        const baseline = (height - ascent - descent) / 2 + ascent;
        return baseline;
      }

      function drawStretchedBackground(ctx, image, width, height, x, dpr) {
        const sourceStretchWidth = image.naturalHeight / DESIGN_HEIGHT;
        const sourceStretchX = (image.naturalWidth - sourceStretchWidth) / 2;
        const sourceRightX = sourceStretchX + sourceStretchWidth;
        const canvasWidth = Math.round(width * dpr);
        const canvasHeight = Math.round(height * dpr);
        const leftWidth = Math.round(sourceStretchX * canvasHeight / image.naturalHeight);
        const rightNaturalWidth = image.naturalWidth - sourceRightX;
        const rightWidth = Math.round(rightNaturalWidth * canvasHeight / image.naturalHeight);
        const centerWidth = Math.max(1, canvasWidth - leftWidth - rightWidth);
        const xPosition = Math.round(x * dpr);
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(image, 0, 0, sourceStretchX, image.naturalHeight, xPosition, 0, leftWidth, canvasHeight);
        ctx.drawImage(image, sourceStretchX, 0, sourceStretchWidth, image.naturalHeight, xPosition + leftWidth, 0, centerWidth, canvasHeight);
        ctx.drawImage(image, sourceRightX, 0, rightNaturalWidth, image.naturalHeight, xPosition + leftWidth + centerWidth, 0, rightWidth, canvasHeight);
        ctx.restore();
      }

      function getLayerLayout(backgroundWidth, height) {
        const leftDecorationWidth = decorationWidth(state.left, height);
        const rightDecorationWidth = decorationWidth(state.right, height);
        const backgroundX = leftDecorationWidth / 2;
        const canvasWidth = backgroundX + backgroundWidth;
        return { leftDecorationWidth, rightDecorationWidth, backgroundX, canvasWidth };
      }

      function drawDecoration(ctx, asset, side, backgroundX, backgroundWidth, height) {
        if (!asset || asset.type !== 'png') return;
        const width = decorationWidth(asset, height);
        const x = side === 'right' ? backgroundX + backgroundWidth - width : 0;
        ctx.drawImage(asset.image, x, 0, width, height);
      }

      function stopSvgaPlayers(preview) {
        preview.players.forEach((player) => { try { player.stopAnimation(); } catch {} });
        preview.players = [];
        preview.svgaLayer.replaceChildren();
      }

      function createSvgaPlayer(preview, asset, side, layout, backgroundWidth) {
        if (!asset || asset.type !== 'svga' || !window.SVGA) return;
        const width = decorationWidth(asset, preview.height);
        const x = side === 'right' ? layout.backgroundX + backgroundWidth - width : 0;
        const playerCanvas = document.createElement('canvas');
        playerCanvas.width = Math.round(width);
        playerCanvas.height = Math.round(preview.height);
        playerCanvas.style.cssText = `position:absolute;left:${preview.canvas.offsetLeft + x}px;top:${preview.canvas.offsetTop}px;width:${width}px;height:${preview.height}px;`;
        preview.svgaLayer.append(playerCanvas);
        const player = new SVGA.Player(playerCanvas);
        const parser = new SVGA.Parser();
        parser.load(asset.file, (videoItem) => {
          player.setVideoItem(videoItem);
          player.loops = 0;
          player.startAnimation();
        }, () => playerCanvas.remove());
        preview.players.push(player);
      }

      function renderTextOverlay(preview, layout, backgroundWidth, text, baseline) {
        const hasSvga = state.left?.type === 'svga' || state.right?.type === 'svga';
        preview.textCanvas.style.display = hasSvga ? 'block' : 'none';
        if (!hasSvga) return;
        const dpr = window.devicePixelRatio || 1;
        preview.textCanvas.width = preview.canvas.width;
        preview.textCanvas.height = preview.canvas.height;
        preview.textCanvas.style.width = preview.canvas.style.width;
        preview.textCanvas.style.height = preview.canvas.style.height;
        preview.textCanvas.style.left = `${preview.canvas.offsetLeft}px`;
        preview.textCanvas.style.top = `${preview.canvas.offsetTop}px`;
        const ctx = preview.textCanvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = inputs.color.value;
        ctx.font = fontValue(preview.height);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(text, layout.backgroundX + backgroundWidth / 2, baseline, backgroundWidth - 12 * (preview.height / DESIGN_HEIGHT));
      }

      function previewType() {
        if (state.left && state.right) return '双侧装饰';
        if (state.left) return '仅左侧装饰';
        if (state.right) return '仅右侧装饰';
        return '无装饰';
      }

      function renderPreview(preview) {
        const { height, canvas, shell, empty } = preview;
        shell.classList.toggle('solid', !inputs.checker.checked);
        if (!state.background) {
          canvas.style.display = 'none';
          empty.style.display = 'block';
          preview.textCanvas.style.display = 'none';
          stopSvgaPlayers(preview);
          return;
        }
        const measurementContext = canvas.getContext('2d');
        const text = inputs.text.value || ' ';
        measurementContext.font = fontValue(height);
        const backgroundWidth = calculatePreviewWidth(measurementContext, text, height);
        const layout = getLayerLayout(backgroundWidth, height);
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(layout.canvasWidth * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = `${layout.canvasWidth}px`;
        canvas.style.height = `${height}px`;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, layout.canvasWidth, height);
        drawStretchedBackground(ctx, state.background, backgroundWidth, height, layout.backgroundX, dpr);
        drawDecoration(ctx, state.left, 'left', layout.backgroundX, backgroundWidth, height);
        drawDecoration(ctx, state.right, 'right', layout.backgroundX, backgroundWidth, height);
        ctx.save();
        ctx.fillStyle = inputs.color.value;
        ctx.font = fontValue(height);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        const baseline = getVerticallyCenteredBaseline(ctx, text, height);
        ctx.fillText(text, layout.backgroundX + backgroundWidth / 2, baseline, backgroundWidth - 12 * (height / DESIGN_HEIGHT));
        ctx.restore();
        canvas.style.display = 'block';
        empty.style.display = 'none';
        stopSvgaPlayers(preview);
        createSvgaPlayer(preview, state.left, 'left', layout, backgroundWidth);
        createSvgaPlayer(preview, state.right, 'right', layout, backgroundWidth);
        renderTextOverlay(preview, layout, backgroundWidth, text, baseline);
      }

      function renderAllPreviews() {
        previews.forEach(renderPreview);
      }

      function loadImage(kind, file) {
        if (!file) return;
        const isSvga = file.name.toLowerCase().endsWith('.svga');
        if (kind !== 'background' && isSvga) {
          if (state.urls[kind]) URL.revokeObjectURL(state.urls[kind]);
          state[kind] = { type: 'svga', file };
          state.urls[kind] = null;
          renderAllPreviews();
          return;
        }
        if (file.type !== 'image/png') {
          inputs[kind].value = '';
          return;
        }
        if (state.urls[kind]) URL.revokeObjectURL(state.urls[kind]);
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          state[kind] = kind === 'background' ? image : { type: 'png', image };
          state.urls[kind] = url;
          renderAllPreviews();
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
        };
        image.src = url;
      }

      function clearImage(kind) {
        if (state.urls[kind]) URL.revokeObjectURL(state.urls[kind]);
        state[kind] = null;
        state.urls[kind] = null;
        inputs[kind].value = '';
        renderAllPreviews();
      }

      inputs.background.addEventListener('change', (event) => loadImage('background', event.target.files[0]));
      inputs.left.addEventListener('change', (event) => loadImage('left', event.target.files[0]));
      inputs.right.addEventListener('change', (event) => loadImage('right', event.target.files[0]));
      document.querySelectorAll('[data-clear]').forEach((button) => button.addEventListener('click', () => clearImage(button.dataset.clear)));
      [inputs.text, inputs.fontSize, inputs.color, inputs.checker].forEach((input) => input.addEventListener('input', renderAllPreviews));
      renderAllPreviews();
      document.fonts.load('700 36px "Kelson Sans"').then(renderAllPreviews);
    })();
  </script>
</body>
</html>
